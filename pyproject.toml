[project]
name = "recipe-mcp"
version = "0.2.0"
description = "Factorio recipes, technologies, save progress and production planning MCP server"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp==1.30.0",
    "numpy==2.5.3",
    "scipy==1.18.1",
]

[project.scripts]
# The two entry points: an MCP stdio server for MCP clients, and a CLI that calls one tool and exits.
recipe-mcp-server = "recipe_mcp.server:main"
recipe-mcp-cli = "recipe_mcp.cli:main"
# Data exporters that refresh data/ for both.
recipe-mcp-export = "recipe_mcp.export.prototypes:main"
recipe-mcp-export-save = "recipe_mcp.export.save:main"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=8",
    "ruff>=0.16.10",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "realdata: needs the exported prototype dump and a compatible save snapshot in data/",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# The formatter owns line length; what it leaves long is prose in strings.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastMCP validates tool arguments into fresh objects on every call, so mutable defaults are never shared.
"src/recipe_mcp/server.py" = ["B006"]
# Their loop-local helpers are only called within the iteration that defines them.
"scripts/analysis/science_fluids.py" = ["B023"]
"scripts/pressure_report/zones.py" = ["B023"]

[tool.ruff.lint.isort]
# Scripts import their siblings by bare module name; without this ruff files them as third-party.
known-first-party = ["recipe_mcp", "science_fluids", "zones"]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests", "scripts"]
# Scripts are run directly and import their siblings by bare module name.
mypy_path = ["src", "scripts/analysis", "scripts/pressure_report"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# Neither ships type information (no py.typed); stubs would add a dependency for little value here.
module = ["scipy.*", "playwright.*"]
ignore_missing_imports = true
