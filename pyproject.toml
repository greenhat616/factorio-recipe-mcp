[project]
name = "recipe-mcp"
version = "0.2.0"
description = "Factorio recipes, technologies, save progress and production planning MCP server"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp==1.30.0",
    "numpy==2.5.3",
    "scipy==1.18.1",
]

[project.scripts]
recipe-mcp = "recipe_mcp.server:main"
recipe-mcp-client = "recipe_mcp.client:main"
recipe-mcp-export = "recipe_mcp.export.prototypes:main"
recipe-mcp-export-save = "recipe_mcp.export.save:main"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "realdata: needs the exported prototype dump and a compatible save snapshot in data/",
]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests", "scripts"]
# Scripts are run directly and import their siblings by bare module name.
mypy_path = ["src", "scripts/analysis", "scripts/pressure_report"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# Neither ships type information (no py.typed); stubs would add a dependency for little value here.
module = ["scipy.*", "playwright.*"]
ignore_missing_imports = true
