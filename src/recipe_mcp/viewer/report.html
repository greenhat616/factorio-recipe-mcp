<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
:root{color-scheme:dark;--bg:#11191b;--panel:#1a2528;--line:#334246;--muted:#a4b5b6;--mint:#9de0b7;--gold:#efc17e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#e6eeee;font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}button,select,input{font:inherit;color:inherit;background:#223034;border:1px solid #435458;border-radius:6px;padding:7px 12px}button,select{cursor:pointer}button:hover,button.active{border-color:var(--mint);color:var(--mint)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--mint);outline-offset:3px}header{padding:26px 34px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:20px}.eyebrow{letter-spacing:3px;color:var(--mint);font-size:11px}h1{font-size:26px;font-weight:500;margin:4px 0}p{margin:5px 0;color:var(--muted)}.badge{font-size:11px;border:1px solid #4c6657;padding:5px 10px;border-radius:20px;color:var(--mint)}main{padding:24px 34px}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:20px}.toolbar label{color:var(--muted)}#search{margin-left:auto;min-width:270px}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:22px}.card{padding:17px 20px;background:var(--panel);border:1px solid var(--line);border-radius:8px}.card label{display:block;color:var(--muted);font-size:12px}.card strong{font-size:27px;font-weight:450;letter-spacing:-1px}.card small{color:var(--muted);font-size:12px;margin-left:6px}.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding-bottom:10px}.tabs button{background:none;border-color:transparent;padding:7px 17px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 300px;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:16px}.canvas{min-width:0;background:radial-gradient(#304044 1px,transparent 1px);background-size:22px 22px}.canvas-head{display:flex;justify-content:space-between;align-items:center;padding:13px 18px;background:var(--panel);border-bottom:1px solid var(--line)}.canvas-head span{color:var(--muted);font-size:12px}#diagram{height:480px;overflow:auto}svg{display:block;min-width:100%;height:100%}.node{cursor:pointer}.node rect{stroke:#56716b;stroke-width:1;fill:#233b34}.node.item rect{fill:#263339;stroke:#4e6671}.node.endpoint rect{fill:#3a3023;stroke:#92754d}.node.block rect{fill:#284034;stroke:#9de0b7}.node.selected rect{stroke:#fff;stroke-width:2}.node text{fill:#e2edeb;font-size:11px}.node .sub{fill:#acbdb9;font-size:10px}.edge{fill:none;stroke:#6a8e84;stroke-width:1.5;opacity:.6}.edge.link{stroke:var(--gold);stroke-dasharray:6 5}.edge:hover{stroke:#d9f2e2;opacity:1;stroke-width:3}.edge-label{font-size:9px;fill:#becdc8;paint-order:stroke;stroke:var(--bg);stroke-width:3px;pointer-events:none}.dim{opacity:.12}aside{padding:19px;background:var(--panel);border-left:1px solid var(--line);overflow:auto;max-height:540px}aside h2{font-size:15px;margin:0 0 14px;font-weight:500}aside p{font-size:12px}pre{white-space:pre-wrap;word-break:break-word;font:11px/1.6 Consolas,monospace;color:#bdceca}#selection-title{overflow-wrap:anywhere;color:var(--mint)}.legend{display:flex;gap:22px;color:var(--muted);font-size:11px;padding:12px 18px;background:var(--panel)}.legend b{margin-right:6px;color:var(--mint)}.data-panel{margin-top:16px;overflow:auto;max-height:570px;border:1px solid var(--line);border-radius:8px}table{border-collapse:collapse;width:100%;font-size:12px}th{text-align:left;color:var(--muted);background:var(--panel);position:sticky;top:0;white-space:nowrap}td,th{padding:11px 16px;border-bottom:1px solid #29383b}td.number{font-variant-numeric:tabular-nums;text-align:right}tr:hover td{background:#1c2d2c}td:first-child{max-width:410px;overflow-wrap:anywhere}details{border-top:1px solid var(--line);padding:16px 0;margin-top:22px}summary{cursor:pointer;color:var(--muted)}#notes{font-size:12px;padding:12px 18px;max-height:230px;overflow:auto}#notes li{padding:3px 0}.hidden{display:none!important}.status-error{color:#f0ae96}#message{color:#f0ae96;padding:10px 0}footer{color:#819594;font-size:11px;display:flex;justify-content:space-between;margin-top:12px;gap:20px}#file{max-width:245px;font-size:12px}#download{font-size:12px}@media(max-width:950px){header,main{padding:20px}.cards{grid-template-columns:repeat(3,1fr)}.workspace{grid-template-columns:1fr}aside{border-left:0;border-top:1px solid var(--line);max-height:280px}.card strong{font-size:22px}#search{margin-left:0;min-width:180px}footer{display:block}}
</style>
<header><div><div class="eyebrow">FACTORIO / PRODUCTION LAB</div><h1>__TITLE__</h1><p id="subtitle">从需求到每一条实际物料流。</p></div><div class="badge">离线报告 · 数据保留在本机</div></header>
<main>
<div class="toolbar"><label for="scope">观察范围</label><select id="scope"></select><label for="language">对象名称</label><select id="language" aria-label="对象名称语言"></select><button id="download">导出 JSON</button><label for="file">打开结果</label><input id="file" type="file" accept=".json,application/json"><input id="search" aria-label="搜索物料或产线" placeholder="搜索物料、产线或机器…"></div>
<div id="message" role="alert" class="hidden"></div><div class="cards" id="cards"></div>
<nav class="tabs" aria-label="结果视图"><button class="active" data-tab="flow">流程图</button><button data-tab="lines">产线与设备</button><button data-tab="items">物料账本</button><button data-tab="links">区块引用</button></nav>
<section class="workspace" id="flow"><div class="canvas"><div class="canvas-head"><span id="graph-caption"></span><div><button id="zoom-out" aria-label="缩小">−</button> <button id="fit">适应画布</button> <button id="zoom-in" aria-label="放大">＋</button></div></div><div id="diagram"></div><div class="legend"><span><b>▣</b>产线 / 区块</span><span>◇ 物料</span><span style="color:var(--gold)">▸ 外部端点 · 虚线为引用</span></div></div><aside><h2 id="selection-title">点击节点，检查流量</h2><p id="selection-hint">箭头表示物料流向。电与热始终以 MW 显示，其他流量遵循方案时间单位。</p><div id="selection"></div></aside></section>
<section id="table-panel" class="data-panel hidden"></section>
<details><summary id="notes-title">计算假设、警告与数据来源</summary><ul id="notes"></ul></details>
<footer><span id="provenance"></span><span>图示反映计算流量；物流路径与实际布局由你决定。</span></footer>
</main>
<script type="application/json" id="payload">__DATA__</script>
<script>
'use strict';
const $=id=>document.getElementById(id), ns='http://www.w3.org/2000/svg';
const fmt=n=>typeof n==='number'?n.toLocaleString('zh-CN',{maximumFractionDigits:5}):String(n??'—');
const fmtCard=n=>typeof n==='number'?n.toLocaleString('zh-CN',{maximumFractionDigits:2}):'—';
const el=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e};
const sv=(tag,attrs={},text)=>{const e=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,String(v)));if(text!==undefined)e.textContent=text;return e};
let data,current,graph,selectedNode,tab='flow',zoom=1;
function unwrap(d){if(d.structuredContent)return unwrap(d.structuredContent);if(d.content){const t=d.content.find(c=>c.type==='text');if(t)return unwrap(JSON.parse(t.text))}if(!d.graph||d.graph.schema_version!==1)throw Error('需要 schema 1 图数据。求解时启用 graph=bipartite 或 graph=full。');return d}
function load(d){data=unwrap(d);selectedNode=null;$('language').replaceChildren(...Object.keys(data.names?.translations||{}).map(lang=>new Option(({en:'English','zh-CN':'简体中文','zh-TW':'繁體中文',de:'Deutsch',ja:'日本語'})[lang]||lang,lang)),new Option('原型 ID','id'));$('language').value=data.names?.language||'id';$('search').value='';$('selection').replaceChildren();$('selection-title').textContent='点击节点，检查流量';$('scope').replaceChildren();if(data.factory){$('scope').append(new Option('整个工厂', 'factory'));data.blocks.forEach(b=>$('scope').append(new Option(b.id+(b.status==='error'?' · 错误':''),b.id)))}else $('scope').append(new Option('生产方案','production'));$('subtitle').textContent=data.plan?`方案 ${data.plan} · 修订 ${data.revision} · ${data.blocks.length} 个区块`:'单区块生产方案 · 请求与实际达成均可检查';$('message').classList.add('hidden');changeScope()}
function changeScope(){const id=$('scope').value;const block=data.blocks?.find(b=>b.id===id);current=block?(block.result||block):data;graph=current.graph;if(!graph&&block&&data.graph){const prefix=`block:${id}/`;graph={nodes:data.graph.nodes.filter(n=>n.id.startsWith(prefix)),edges:data.graph.edges.filter(e=>e.source.startsWith(prefix)&&e.target.startsWith(prefix)),notes:[]}}if(!graph)graph={nodes:[],edges:[],notes:[]};if(id==='factory')graph={...graph,nodes:graph.nodes.filter(n=>!n.id.includes('/')),edges:graph.edges.filter(e=>!e.source.includes('/')&&!e.target.includes('/'))};zoom=1;renderCards();renderNotes();render()}
function renderCards(){const t=current.factory?.totals||current.copies_totals||current.totals||{};const status=current.factory?(current.factory.complete?'完整':'部分结果'):current.status;const labels={optimal:'已求解',infeasible:'不可行',time_limit:'限时可行解',error:'区块错误'};const cards=[['求解状态',labels[status]||status,''],['设备容量',fmtCard(t.machines),'台'],['容量取整',fmt(t.machines_ceil),'台'],['用电 / 发电',`${fmtCard(t.power_MW)} / ${fmtCard(t.electric_generation_MW)}`,'MW'],['用热 / 产热',`${fmtCard(t.heat_consumption_MW)} / ${fmtCard(t.heat_generation_MW)}`,'MW']];$('cards').replaceChildren(...cards.map(([label,value,unit])=>{const c=el('div',undefined,'card');c.append(el('label',label),el('strong',value),el('small',unit));return c}));if(current.status==='infeasible'||current.status==='error'){$('message').textContent=current.error||'此方案不可行。图和表显示放宽约束后的实际流量，请检查短缺与限制。';$('message').classList.remove('hidden')}else $('message').classList.add('hidden')}
function renderNotes(){const notes=[...(data.warnings||[]),...(data.names?.warnings||[]),...(current!==data?current.warnings||[]:[]),...(current.factory?.assumptions||[]),...(current.factory?data.blocks.flatMap(b=>b.warnings||[]):[]),...(graph.notes||[])];if(current.energy_factors&&Object.keys(current.energy_factors).length)notes.push('能源系数：'+JSON.stringify(current.energy_factors));if(current.max_balance_error!==undefined)notes.push('最大平衡误差：'+current.max_balance_error);if(current.copies>1)notes.push(`区块分为 ${current.copies} 份，建设取整按每份计算。`);if(current.infeasibility?.length)notes.push('约束诊断：'+JSON.stringify(current.infeasibility));$('notes').replaceChildren(...[...new Set(notes)].map(n=>el('li',n)));$('notes-title').textContent=`计算假设、警告与数据来源（${new Set(notes).size}）`;const p=current.snapshot_provenance||data.blocks?.find(b=>b.result?.snapshot_provenance)?.result.snapshot_provenance;$('provenance').textContent=p?`快照 tick ${p.tick} · ${p.exported_at||''}`:`数据状态：${data.stale||'独立求解结果'} · 图协议 v1`}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('flow').classList.toggle('hidden',tab!=='flow');$('table-panel').classList.toggle('hidden',tab==='flow');if(tab==='flow')draw();else drawTable();}
function nameMap(){return data.names?.translations?.[$('language').value]||{}}
function nameKey(id,kind){return kind?`${kind}:${id}`:id}
function display(id,kind){return nameMap()[nameKey(id,kind)]?.display_name||id}
function nodeKey(n){return n.data?.recipe?nameKey(n.data.recipe,'recipe'):n.data?.key||n.label}
function nodeName(n){return n.kind==='block'?n.label:display(nodeKey(n))}
function namedLine(line){const e=namedCell(line.recipe,'recipe');if(line.block)e.prepend(el('small',line.block+' / '));return e}
function namedCell(id,kind){const e=el('span',display(id,kind));e.title=nameKey(id,kind);if(display(id,kind)!==id){const code=el('code',id);code.style.cssText='display:block;color:var(--muted);font-size:10px';e.append(code)}return e}
function matches(value){const raw=JSON.stringify(value).toLowerCase(),query=$('search').value.toLowerCase();return raw.includes(query)||Object.entries(nameMap()).some(([k,n])=>n.display_name.toLowerCase().includes(query)&&(raw.includes(k.toLowerCase())||raw.includes(JSON.stringify(n.name).toLowerCase())))}
function draw(){const nodes=graph.nodes, edges=graph.edges.filter(e=>e.kind==='flow'||e.kind==='link');const maxDepth=Math.min(16,Math.max(0,...nodes.map(n=>n.depth||0)));const groups=new Map(),positions=new Map();nodes.forEach(n=>{const col=n.depth===null?0:maxDepth-Math.min(n.depth,maxDepth);if(!groups.has(col))groups.set(col,[]);groups.get(col).push(n)});const width=Math.max(760,(maxDepth+1)*190+40),height=Math.max(450,...[...groups.values()].map(g=>g.length*80+40));const svg=sv('svg',{viewBox:`0 0 ${width} ${height}`,role:'img','aria-label':'生产物料流程图'});svg.style.width=`${zoom*100}%`;svg.style.minWidth=zoom>1?`${zoom*760}px`:'100%';svg.style.height=zoom>1?`${zoom*480}px`:'100%';const defs=sv('defs'),marker=sv('marker',{id:'arrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto-start-reverse'});marker.append(sv('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'#87b09d'}));defs.append(marker);svg.append(defs);groups.forEach((g,col)=>g.forEach((n,i)=>positions.set(n.id,{x:20+col*190,y:20+(i+.5)*((height-40)/g.length)})));
edges.forEach(e=>{const a=positions.get(e.source),b=positions.get(e.target);if(!a||!b)return;const forward=b.x>a.x;const x1=a.x+(forward?160:0),x2=b.x+(forward?0:160);const bend=forward?(x1+x2)/2:Math.max(x1,x2)+65;const path=sv('path',{d:`M${x1} ${a.y} C${bend} ${a.y},${bend} ${b.y},${x2} ${b.y}`,class:'edge '+e.kind+(matches(e)?'':' dim'),'marker-end':'url(#arrow)'});path.append(sv('title',{},`${display(e.item)} (${e.item}): ${fmt(e.rate)} ${e.unit}`));path.addEventListener('click',()=>inspect({label:e.item,data:e}));svg.append(path);if(nodes.length<32){const label=sv('text',{x:(x1+x2)/2,y:(a.y+b.y)/2-4,'text-anchor':'middle',class:'edge-label'},`${fmt(e.rate)}${e.unit==='MW'?' MW':''}`);svg.append(label)}});
nodes.forEach(n=>{const p=positions.get(n.id),cls=['item','line','block','disposal'].includes(n.kind)?n.kind:'endpoint';const g=sv('g',{transform:`translate(${p.x},${p.y-23})`,class:`node ${cls}${matches(n)?'':' dim'}`,tabindex:0,role:'button','aria-label':nodeName(n)});g.append(sv('rect',{width:160,height:46,rx:7}));const name=nodeName(n);g.append(sv('text',{x:9,y:18},name.length>23?name.slice(0,22)+'…':name));let hint=n.kind==='item'?n.data.unit:n.data.machines!==undefined?`${fmt(n.data.machines)} 台 · ${fmt(n.data.power_MW)} MW`:n.kind==='block'?n.data.status:n.kind;g.append(sv('text',{x:9,y:34,class:'sub'},hint));g.append(sv('title',{},`${nodeName(n)}\n${n.label}`));const select=()=>{svg.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));g.classList.add('selected');inspect(n)};g.addEventListener('click',select);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select()}});svg.append(g)});$('diagram').replaceChildren(svg);$('graph-caption').textContent=`${nodes.length} 个节点 · ${edges.length} 条流向 · 点击检查，搜索高亮`}
function inspect(node){selectedNode=node;$('selection-title').textContent=nodeName(node);$('selection-hint').textContent='当前节点及其连接的实际求解数据';const detail={id:node.id,label:node.label,name:nameMap()[nodeKey(node)],...node.data};if(node.id){detail.流入=graph.edges.filter(e=>e.kind==='flow'&&e.target===node.id).map(e=>({来源:e.source,物料:e.item,流量:e.rate,单位:e.unit}));detail.流出=graph.edges.filter(e=>e.kind==='flow'&&e.source===node.id).map(e=>({去向:e.target,物料:e.item,流量:e.rate,单位:e.unit}))}if(detail.children)delete detail.children;$('selection').replaceChildren(el('pre',JSON.stringify(detail,null,2)))}
function allLines(){if(current.lines)return current.lines;return current.blocks?.flatMap(b=>(b.result?.lines||[]).map(l=>({...l,block:b.id})))||[]}
function drawTable(){let heads,rows;if(tab==='lines'){heads=['区块 / 配方','机器','有效台数','取整台数','电力 MW','燃料 / 每台','插件 / 信标'];rows=allLines().filter(l=>l.machine_type!=='temperature-match').filter(matches).map(l=>[namedLine(l),namedCell(l.machine,'entity'),fmt(l.machines),fmt(l.machines_ceil),fmt(l.power_MW),l.fuel?`${display(l.fuel,l.fuel.includes(':')?undefined:'item')}: ${fmt(l.fuel_per_machine)}`:'—',`${(l.modules||[]).map(n=>display(n,'item')).join(', ')||'—'} / ${fmt(l.beacon_count)} ${(l.beacons||[]).map(b=>display(b.entity||b.beacon,'entity')).join(', ')}`])}else if(tab==='links'){heads=['来源区块','引用区块','物料','取值来源','倍数','解析量','单位'];rows=graph.edges.filter(e=>e.kind==='link'&&matches(e)).map(e=>[e.source,e.target,namedCell(e.item),e.data.of,fmt(e.data.factor),fmt(e.data.resolved),e.unit])}else if(current.factory){heads=['物料','净输入','内部转移','净输出（含待处置）','单位'];const f=current.factory;rows=[...new Set([...Object.keys(f.net_inputs),...Object.keys(f.net_outputs),...Object.keys(f.internal_transfers)])].sort().filter(matches).map(k=>[namedCell(k),fmt(f.net_inputs[k]||0),fmt(f.internal_transfers[k]||0),fmt(f.net_outputs[k]||0),k.startsWith('energy:')?'MW':`per ${data.blocks?.[0]?.result?.per||'second'}`])}else{heads=['物料','生产','消耗','导入 / 外部供应','请求目标','达成目标','溢出','单位'];rows=(current.items||[]).filter(matches).map(i=>[namedCell(i.item),fmt(i.produced),fmt(i.consumed),`${fmt(i.imported)} / ${fmt(i.supplied)}`,fmt(current.targets?.[i.item]||0),fmt(i.target),fmt(i.surplus),i.unit])}const table=el('table'),thead=el('thead'),tr=el('tr');heads.forEach(h=>tr.append(el('th',h)));thead.append(tr);table.append(thead);const tbody=el('tbody');rows.forEach(row=>{const tr=el('tr');row.forEach(cell=>{const td=el('td');td.append(cell instanceof Node?cell:document.createTextNode(String(cell)));tr.append(td)});tbody.append(tr)});table.append(tbody);$('table-panel').replaceChildren(table);if(!rows.length)$('table-panel').append(el('p','当前范围没有匹配的数据。'))}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;render()}));$('language').addEventListener('change',()=>{render();if(selectedNode)inspect(selectedNode)});$('scope').addEventListener('change',()=>{selectedNode=null;$('selection').replaceChildren();$('selection-title').textContent='点击节点，检查流量';changeScope()});$('search').addEventListener('input',render);$('zoom-in').onclick=()=>{zoom=Math.min(8,zoom*1.4);draw()};$('zoom-out').onclick=()=>{zoom=Math.max(1,zoom/1.4);draw()};$('fit').onclick=()=>{zoom=1;draw()};$('file').addEventListener('change',async()=>{try{const f=$('file').files[0];if(f){load(JSON.parse(await f.text()));document.querySelector('h1').textContent=f.name.replace(/\.json$/,'')+' · 规划观察器'}}catch(e){$('message').textContent=e.message;$('message').classList.remove('hidden')}});$('download').onclick=()=>{const a=el('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='production-plan.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
try{load(JSON.parse($('payload').textContent))}catch(e){$('message').textContent=e.message;$('message').classList.remove('hidden')}
</script>
</html>
